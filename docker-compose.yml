version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/shrayu_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=
      - PORT=5000
      # The worker service below delivers emails
      - EMAIL_INLINE_WORKER=false
    depends_on:
      - mongodb
      - redis
    networks:
      - app-network

  worker:
    build: .
    command: node src/workers/emailWorker.js
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/shrayu_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=
    depends_on:
      - mongodb
      - redis
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    # No authentication is configured, so only expose the port on this machine
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
